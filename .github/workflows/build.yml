name: Käännä APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Käännä
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Nimeä APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Valvontakamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Valvontakamera-apk
          path: Valvontakamera.apk

      - name: Julkaise ladattavaksi (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: uusin
          name: Valvontakamera (uusin käännös)
          body: Lataa Valvontakamera.apk puhelimeen ja asenna.
          files: Valvontakamera.apk
          make_latest: true
